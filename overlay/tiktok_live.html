<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Vertical Overlay (9:16)</title>
    <link rel="stylesheet" href="tiktok_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="vertical-container">
        <!-- TOP HUD: LAST STANDING BANNER -->
        <div class="top-hud">
            <h1 class="last-standing-title">LAST STANDING</h1>
            <div class="last-standing-username">★ <span id="top-user-name">@tu_usuario_tiktok</span> ★</div>
            
            <!-- DUEL VS BAR -->
            <div class="vs-bar-container">
                <span class="user-left" id="user-left-name">Luchador 1</span>
                <div class="vs-bar-wrapper">
                    <div class="vs-fill left-fill" id="left-fill" style="width: 50%;"></div>
                    <div class="vs-badge">VS</div>
                    <div class="vs-fill right-fill" id="right-fill" style="width: 50%;"></div>
                </div>
                <span class="user-right" id="user-right-name">Luchador 2</span>
            </div>
        </div>

        <!-- TRANSPARENT GAMEPLAY VIEWPORT -->
        <div class="game-viewport-916"></div>

        <!-- BOTTOM SCOREBOARDS -->
        <div class="scores-layout">
            <div class="score-card daily-card">
                <div class="score-title">Top Donadores :</div>
                <ol class="score-list" id="leaderboard">
                    <li class="empty-msg">Envía un regalo para aparecer aquí...</li>
                </ol>
            </div>
        </div>

        <!-- BOTTOM GIFTS CARDS CATALOG FOR VIEWERS -->
        <div class="gift-catalog-grid">
            <div class="gift-tile"><span class="gift-badge">🌹</span><span class="gift-lbl">Rosa</span></div>
            <div class="gift-tile"><span class="gift-badge">🍦</span><span class="gift-lbl">Helado</span></div>
            <div class="gift-tile"><span class="gift-badge">🍩</span><span class="gift-lbl">Dona</span></div>
            <div class="gift-tile"><span class="gift-badge">🚀</span><span class="gift-lbl">Cohete</span></div>
            <div class="gift-tile"><span class="gift-badge">🎩</span><span class="gift-lbl">Sombrero</span></div>
            <div class="gift-tile"><span class="gift-badge">💖</span><span class="gift-lbl">Corazón</span></div>
            <div class="gift-tile"><span class="gift-badge">🦁</span><span class="gift-lbl">León</span></div>
            <div class="gift-tile"><span class="gift-badge">🌌</span><span class="gift-lbl">Universo</span></div>
            <div class="gift-tile"><span class="gift-badge">👆</span><span class="gift-lbl">2 Taps</span></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
